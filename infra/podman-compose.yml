services:
  nebula-metad:
    image: m.daocloud.io/docker.io/vesoft/nebula-metad:v3.8.0
    container_name: lumisight-nebula-metad
    command: ["--meta_server_addrs=nebula-metad:9559", "--local_ip=nebula-metad", "--ws_ip=nebula-metad", "--port=9559", "--data_path=/data/meta"]
    ports:
      - "9559:9559"
    volumes:
      - ./data/nebula/meta:/data/meta
    networks:
      - lumisight-net

  nebula-storaged:
    image: m.daocloud.io/docker.io/vesoft/nebula-storaged:v3.8.0
    container_name: lumisight-nebula-storaged
    command: ["--meta_server_addrs=nebula-metad:9559", "--local_ip=nebula-storaged", "--ws_ip=nebula-storaged", "--port=9779", "--data_path=/data/storage"]
    ports:
      - "9779:9779"
    volumes:
      - ./data/nebula/storage:/data/storage
    depends_on:
      - nebula-metad
    networks:
      - lumisight-net

  nebula-graphd:
    image: m.daocloud.io/docker.io/vesoft/nebula-graphd:v3.8.0
    container_name: lumisight-nebula-graphd
    command: ["--meta_server_addrs=nebula-metad:9559", "--local_ip=nebula-graphd", "--ws_ip=nebula-graphd", "--port=9669"]
    ports:
      - "9669:9669"
    depends_on:
      - nebula-metad
      - nebula-storaged
    networks:
      - lumisight-net

  milvus-etcd:
    image: m.daocloud.io/quay.io/coreos/etcd:v3.5.18
    container_name: lumisight-milvus-etcd
    command: ["etcd", "-advertise-client-urls=http://127.0.0.1:2379", "-listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes:
      - ./data/milvus/etcd:/etcd
    ports:
      - "2379:2379"
    networks:
      - lumisight-net

  milvus-minio:
    image: m.daocloud.io/docker.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: lumisight-milvus-minio
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/milvus/minio:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - lumisight-net

  milvus-standalone:
    image: m.daocloud.io/docker.io/milvusdb/milvus:v2.5.5
    container_name: lumisight-milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - ./data/milvus/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - lumisight-net

networks:
  lumisight-net:
    driver: bridge
