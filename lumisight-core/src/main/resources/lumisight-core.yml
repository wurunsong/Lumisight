spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
  ai:
    model:
      chat: openai
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      base-url: ${CHAT_BASE_URL:https://api.deepseek.com}
      api-key: ${CHAT_API_KEY:${OPENAI_API_KEY:}}
      chat:
        options:
          model: ${CHAT_MODEL:deepseek-v4-pro}
    retry:
      max-attempts: ${SPRING_AI_RETRY_MAX_ATTEMPTS:1}
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        embeddings-path: ${EMBEDDING_PATH:/v1/embeddings}
        api-key: ${EMBEDDING_API_KEY:}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-v3}
    vectorstore:
      milvus:
        enabled: false
        client:
          host: 127.0.0.1
          port: 19530
        initialize-schema: true
        collection-name: lumisight_vectors_1024

lumisight:
  sandbox:
    enabled: ${LUMISIGHT_SANDBOX_ENABLED:true}
    mode: ${LUMISIGHT_SANDBOX_MODE:mac-seatbelt}
    network-enabled: ${LUMISIGHT_SANDBOX_NETWORK_ENABLED:false}
    timeout-seconds: ${LUMISIGHT_SANDBOX_TIMEOUT_SECONDS:20}
    max-output-bytes: ${LUMISIGHT_SANDBOX_MAX_OUTPUT_BYTES:200000}
    memory-mb: ${LUMISIGHT_SANDBOX_MEMORY_MB:512}
    cpu-limit: ${LUMISIGHT_SANDBOX_CPU_LIMIT:1.0}
    container-image: ${LUMISIGHT_SANDBOX_IMAGE:docker.io/library/openjdk:21-jdk}
    snapshot-dir: ${LUMISIGHT_SANDBOX_SNAPSHOT_DIR:.lumisight/snapshots}
  ai:
    chat-api-key: ${CHAT_API_KEY:}
    embedding-api-key: ${EMBEDDING_API_KEY:}
    chat-connect-timeout-seconds: ${LUMISIGHT_AI_CHAT_CONNECT_TIMEOUT_SECONDS:10}
    chat-read-timeout-seconds: ${LUMISIGHT_AI_CHAT_READ_TIMEOUT_SECONDS:120}
  kg:
    enabled: false
  vector:
    enabled: false
  skills:
    allowed-paths:
      - .lumisight/skills
  agent:
    context:
      artifact-dir: ${LUMISIGHT_AGENT_CONTEXT_ARTIFACT_DIR:.lumisight/context-artifacts}
      single-artifact-bytes: ${LUMISIGHT_AGENT_CONTEXT_SINGLE_ARTIFACT_BYTES:51200}
      tool-message-bytes: ${LUMISIGHT_AGENT_CONTEXT_TOOL_MESSAGE_BYTES:204800}
      preview-bytes: ${LUMISIGHT_AGENT_CONTEXT_PREVIEW_BYTES:2048}
      snip-trigger-tokens: ${LUMISIGHT_AGENT_CONTEXT_SNIP_TRIGGER_TOKENS:24000}
      snip-target-tokens: ${LUMISIGHT_AGENT_CONTEXT_SNIP_TARGET_TOKENS:18000}
      projection-soft-tokens: ${LUMISIGHT_AGENT_CONTEXT_PROJECTION_SOFT_TOKENS:28000}
      projection-hard-tokens: ${LUMISIGHT_AGENT_CONTEXT_PROJECTION_HARD_TOKENS:34000}
      effective-context-window: ${LUMISIGHT_AGENT_CONTEXT_EFFECTIVE_WINDOW:180000}
      response-reserve-tokens: ${LUMISIGHT_AGENT_CONTEXT_RESPONSE_RESERVE_TOKENS:20000}
      auto-compact-buffer-tokens: ${LUMISIGHT_AGENT_CONTEXT_AUTO_COMPACT_BUFFER_TOKENS:13000}
      micro-compact-keep-recent: ${LUMISIGHT_AGENT_CONTEXT_MICRO_COMPACT_KEEP_RECENT:8}
      snip-keep-recent-conversation: ${LUMISIGHT_AGENT_CONTEXT_SNIP_KEEP_RECENT_CONVERSATION:12}
      post-compact-max-restore-entries: ${LUMISIGHT_AGENT_CONTEXT_POST_COMPACT_MAX_RESTORE_ENTRIES:5}
      post-compact-token-budget: ${LUMISIGHT_AGENT_CONTEXT_POST_COMPACT_TOKEN_BUDGET:50000}
      post-compact-max-tokens-per-entry: ${LUMISIGHT_AGENT_CONTEXT_POST_COMPACT_MAX_TOKENS_PER_ENTRY:5000}
      post-compact-skill-token-budget: ${LUMISIGHT_AGENT_CONTEXT_POST_COMPACT_SKILL_TOKEN_BUDGET:25000}
      micro-compact-stale-minutes: ${LUMISIGHT_AGENT_CONTEXT_MICRO_COMPACT_STALE_MINUTES:60}
      max-auto-compact-failures: ${LUMISIGHT_AGENT_CONTEXT_MAX_AUTO_COMPACT_FAILURES:3}
    conversation:
      waiting-user-ttl-seconds: ${LUMISIGHT_AGENT_WAITING_USER_TTL_SECONDS:900}
      waiting-gate-ttl-seconds: ${LUMISIGHT_AGENT_WAITING_GATE_TTL_SECONDS:1800}
      cleanup-interval-ms: ${LUMISIGHT_AGENT_CONVERSATION_CLEANUP_INTERVAL_MS:60000}
    cron:
      timezone: ${LUMISIGHT_AGENT_CRON_TIMEZONE:Asia/Shanghai}
      scheduler-pool-size: ${LUMISIGHT_AGENT_CRON_POOL_SIZE:2}
      max-recent-runs: ${LUMISIGHT_AGENT_CRON_MAX_RECENT_RUNS:20}
    skill-routing:
      min-confidence: ${LUMISIGHT_AGENT_SKILL_ROUTING_MIN_CONFIDENCE:0.6}
      low-confidence-fallback: ${LUMISIGHT_AGENT_SKILL_ROUTING_LOW_CONFIDENCE_FALLBACK:NONE}
      default-skill-id: ${LUMISIGHT_AGENT_SKILL_ROUTING_DEFAULT_SKILL_ID:}
    websocket:
      allowed-origins: ${LUMISIGHT_AGENT_WS_ALLOWED_ORIGINS:*}
      max-connections: ${LUMISIGHT_AGENT_WS_MAX_CONNECTIONS:200}
      max-text-message-size: ${LUMISIGHT_AGENT_WS_MAX_TEXT_MESSAGE_SIZE:65536}
      send-time-limit-ms: ${LUMISIGHT_AGENT_WS_SEND_TIME_LIMIT_MS:10000}
      send-buffer-size-limit-bytes: ${LUMISIGHT_AGENT_WS_SEND_BUFFER_SIZE_LIMIT_BYTES:512000}
      message-rate-limit-per-minute: ${LUMISIGHT_AGENT_WS_MSG_RATE_PER_MIN:120}
