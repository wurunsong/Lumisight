spring:
  ai:
    model:
      chat: deepseek-v4-flash
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${CHAT_API_KEY:}
      embedding:
        api-key: ${EMBEDDING_API_KEY:}
        options:
          model: text-embedding-v3
    vectorstore:
      milvus:
        client:
          host: 127.0.0.1
          port: 19530
        initialize-schema: true
        collection-name: lumisight_vectors

lumisight:
  ai:
    chat-api-key: ${CHAT_API_KEY:}
    embedding-api-key: ${EMBEDDING_API_KEY:}
  vector:
    enabled: false
