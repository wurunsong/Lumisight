spring:
  application:
    name: lumisight-api
  config:
    import: optional:classpath:lumisight-core.yml
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

lumisight:
  nebula:
    host: 127.0.0.1
    port: 9669
    username: root
    password: nebula

logging:
  level:
    com.lumisight: INFO
    com.lumisight.tools.kg: DEBUG
