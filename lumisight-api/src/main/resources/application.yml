spring:
  application:
    name: lumisight-api
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-large
    vectorstore:
      milvus:
        client:
          host: 127.0.0.1
          port: 19530
        initialize-schema: true
        collection-name: lumisight_vectors

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

lumisight:
  nebula:
    host: 127.0.0.1
    port: 9669
    username: root
    password: nebula

logging:
  level:
    com.lumisight: INFO
    com.lumisight.tools.kg: DEBUG
