<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumisight Agent Console</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap");
    :root {
      --bg0: #f2f7f5;
      --bg1: #dcefe8;
      --card: #ffffff;
      --line: #c9ded6;
      --ink: #102a24;
      --muted: #4f6b63;
      --brand: #0f766e;
      --brand-2: #1d4ed8;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, #d8efe6 0, transparent 45%),
        radial-gradient(circle at 90% 0%, #dce8fb 0, transparent 35%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
      min-height: 100vh;
    }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    .grid { display: grid; gap: 14px; grid-template-columns: 360px 1fr; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(15, 30, 25, 0.08);
      padding: 14px;
    }
    .card h2 { margin: 0 0 10px; font-size: 18px; color: var(--brand-2); }
    label { display: block; font-size: 12px; margin: 10px 0 4px; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font: inherit;
      color: var(--ink);
      background: #fbfffd;
    }
    textarea { min-height: 92px; resize: vertical; }
    .row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    .btns { display: flex; gap: 8px; margin-top: 12px; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      font: 600 14px "Space Grotesk", sans-serif;
      cursor: pointer;
      color: white;
      background: var(--brand);
    }
    button.alt { background: #334155; }
    button.warn { background: var(--danger); }
    .status { margin-top: 8px; font-size: 13px; color: var(--muted); }
    .panel-title { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
    .stream, .final {
      font-family: "IBM Plex Mono", monospace;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: #f8fcfa;
      white-space: pre-wrap;
      overflow: auto;
    }
    .stream { height: 420px; font-size: 12px; }
    .final { min-height: 120px; font-size: 13px; margin-top: 10px; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Lumisight Agent Console</h1>
    <p class="sub">浏览器直接调试 <code>/api/lumisight/agent/stream</code>，实时查看 SSE 事件。</p>
    <div class="grid">
      <section class="card">
        <h2>Request</h2>
        <label>repoRoot</label>
        <input id="repoRoot" value="/Users/wurunsong/personal/Lumisight" />
        <label>question</label>
        <textarea id="question">帮我分析当前工程的 Agent 主流程。</textarea>
        <label>skillPath</label>
        <input id="skillPath" placeholder="/abs/path/to/SKILL.md (可空)" />
        <div class="row">
          <div>
            <label>taskType</label>
            <select id="taskType"><option>BUG_FIX</option><option>CODE_EXPLAIN</option></select>
          </div>
          <div>
            <label>runMode</label>
            <select id="runMode"><option>NORMAL</option><option>PLAN</option></select>
          </div>
        </div>
        <div class="row">
          <div>
            <label>dialogueMode</label>
            <select id="dialogueMode"><option>FOLLOW</option><option>COLLECT</option><option>STEER</option></select>
          </div>
          <div>
            <label>contextLimit</label>
            <input id="contextLimit" type="number" value="5" min="1" />
          </div>
        </div>
        <div class="row">
          <div>
            <label>sessionId</label>
            <input id="sessionId" placeholder="可空" />
          </div>
          <div>
            <label>followUpAnswer</label>
            <input id="followUpAnswer" placeholder="可空" />
          </div>
        </div>
        <div class="row">
          <div>
            <label>includeRagContext</label>
            <select id="includeRagContext"><option value="false">false</option><option value="true">true</option></select>
          </div>
          <div>
            <label>includeKnowledgeGraphContext</label>
            <select id="includeKnowledgeGraphContext"><option value="false">false</option><option value="true">true</option></select>
          </div>
        </div>
        <div class="btns">
          <button id="sendBtn">Start Stream</button>
          <button class="alt" id="clearBtn" type="button">Clear</button>
          <button class="warn" id="stopBtn" type="button">Stop</button>
        </div>
        <div class="status" id="status">idle</div>
      </section>
      <section class="card">
        <h2>Response</h2>
        <p class="panel-title">SSE Events</p>
        <div class="stream" id="stream"></div>
        <p class="panel-title">Final / Token Text</p>
        <div class="final" id="final"></div>
      </section>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const streamBox = $("stream");
    const finalBox = $("final");
    const statusBox = $("status");
    let aborter = null;

    function appendStream(line) {
      streamBox.textContent += line + "\n";
      streamBox.scrollTop = streamBox.scrollHeight;
    }

    function appendFinal(text) {
      finalBox.textContent += text;
      finalBox.scrollTop = finalBox.scrollHeight;
    }

    function asBool(value) {
      return String(value) === "true";
    }

    function payload() {
      const maybe = (v) => v && v.trim().length > 0 ? v.trim() : null;
        return {
          taskType: $("taskType").value,
          repoRoot: $("repoRoot").value.trim(),
          question: $("question").value.trim(),
          skillPath: maybe($("skillPath").value),
          sessionId: maybe($("sessionId").value),
        followUpAnswer: maybe($("followUpAnswer").value),
        approveRiskyToolCall: false,
        interrupt: false,
        resume: false,
        includeRagContext: asBool($("includeRagContext").value),
        includeKnowledgeGraphContext: asBool($("includeKnowledgeGraphContext").value),
        contextLimit: Number($("contextLimit").value || 5),
        runMode: $("runMode").value,
        dialogueMode: $("dialogueMode").value
      };
    }

    async function start() {
      if (aborter) {
        aborter.abort();
      }
      streamBox.textContent = "";
      finalBox.textContent = "";
      aborter = new AbortController();
      statusBox.textContent = "connecting...";

      const response = await fetch("/api/lumisight/agent/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload()),
        signal: aborter.signal
      });
      if (!response.ok || !response.body) {
        statusBox.textContent = "failed: HTTP " + response.status;
        appendStream("HTTP error: " + response.status);
        return;
      }
      statusBox.textContent = "streaming...";

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) {
          statusBox.textContent = "completed";
          break;
        }
        buffer += decoder.decode(value, { stream: true });
        const chunks = buffer.split("\n\n");
        buffer = chunks.pop() || "";
        for (const chunk of chunks) {
          let eventName = "message";
          let data = "";
          for (const line of chunk.split("\n")) {
            if (line.startsWith("event:")) eventName = line.slice(6).trim();
            if (line.startsWith("data:")) data += line.slice(5).trim();
          }
          if (!data) continue;
          appendStream(`[${eventName}] ${data}`);
          try {
            const obj = JSON.parse(data);
            if (obj.type === "TOKEN" || obj.type === "FINAL" || obj.type === "ASK_USER" || obj.type === "ERROR") {
              appendFinal((obj.message || "") + "\n");
            }
          } catch (_) {}
        }
      }
    }

    $("sendBtn").addEventListener("click", () => {
      start().catch((e) => {
        statusBox.textContent = "failed";
        appendStream("Exception: " + e.message);
      });
    });
    $("clearBtn").addEventListener("click", () => {
      streamBox.textContent = "";
      finalBox.textContent = "";
      statusBox.textContent = "idle";
    });
    $("stopBtn").addEventListener("click", () => {
      if (aborter) {
        aborter.abort();
        statusBox.textContent = "stopped";
      }
    });
  </script>
</body>
</html>
