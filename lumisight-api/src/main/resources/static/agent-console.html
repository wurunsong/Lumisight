<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumisight Agent Console</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap");
    :root {
      --bg0: #f2f7f5;
      --bg1: #dcefe8;
      --card: #ffffff;
      --line: #c9ded6;
      --ink: #102a24;
      --muted: #4f6b63;
      --brand: #0f766e;
      --brand-2: #1d4ed8;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, #d8efe6 0, transparent 45%),
        radial-gradient(circle at 90% 0%, #dce8fb 0, transparent 35%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
      min-height: 100vh;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(320px, 380px) minmax(0, 1fr);
      align-items: start;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(15, 30, 25, 0.08);
      padding: 14px;
      min-width: 0;
    }
    .card h2 { margin: 0 0 10px; font-size: 18px; color: var(--brand-2); }
    label { display: block; font-size: 12px; margin: 10px 0 4px; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font: inherit;
      color: var(--ink);
      background: #fbfffd;
      min-width: 0;
    }
    textarea { min-height: 92px; resize: vertical; }
    .row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    .btns {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      font: 600 14px "Space Grotesk", sans-serif;
      cursor: pointer;
      color: white;
      background: var(--brand);
      width: 100%;
      min-height: 40px;
    }
    button.alt { background: #334155; }
    button.warn { background: var(--danger); }
    .status { margin-top: 8px; font-size: 13px; color: var(--muted); }
    .panel-title { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
    .runs { display: grid; gap: 12px; }
    .run-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: #f8fcfa;
    }
    .run-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .run-title {
      font-weight: 700;
      color: var(--brand-2);
      flex: 1 1 280px;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .run-meta {
      flex: 0 0 auto;
      text-align: right;
      white-space: nowrap;
    }
    .stream, .final {
      font-family: "IBM Plex Mono", monospace;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: #ffffff;
      white-space: pre-wrap;
      overflow: auto;
    }
    .stream { height: 220px; font-size: 12px; }
    .final { min-height: 80px; font-size: 13px; margin-top: 10px; }
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
      .wrap { padding: 18px; }
    }
    @media (max-width: 720px) {
      .row { grid-template-columns: 1fr; }
      .btns { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 520px) {
      .wrap { padding: 14px; }
      h1 { font-size: 26px; }
      .btns { grid-template-columns: 1fr; }
      .run-meta {
        width: 100%;
        text-align: left;
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Lumisight Agent Console</h1>
    <p class="sub">按会话维持 1 条 SSE 长连接，再通过命令接口向同一 <code>sessionId</code> 投递问题、恢复或中断请求。</p>
    <div class="grid">
      <section class="card">
        <h2>Request</h2>
        <label>repoRoot</label>
        <input id="repoRoot" placeholder="/path/to/repo" />
        <label>question</label>
        <textarea id="question" placeholder="输入你的问题"></textarea>
        <label>skillPath</label>
        <input id="skillPath" placeholder="registered skill id/name/path (可空)" />
        <div class="row">
          <div>
            <label>taskType</label>
            <select id="taskType">
              <option>BUG_FIX</option>
              <option>CODE_EXPLAIN</option>
              <option selected>CHAT</option>
            </select>
          </div>
          <div>
            <label>runMode</label>
            <select id="runMode">
              <option value="" selected>请选择</option>
              <option>NORMAL</option>
              <option>PLAN</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div>
            <label>dialogueMode</label>
            <select id="dialogueMode">
              <option value="" selected>请选择</option>
              <option>FOLLOW</option>
              <option>COLLECT</option>
              <option>STEER</option>
            </select>
          </div>
          <div>
            <label>contextLimit</label>
            <input id="contextLimit" type="number" min="1" placeholder="可空" />
          </div>
        </div>
        <div class="row">
          <div>
            <label>userId</label>
            <input id="userId" placeholder="自动生成并复用" />
          </div>
          <div>
            <label>sessionId</label>
            <input id="sessionId" placeholder="自动生成并复用" />
          </div>
        </div>
        <div class="row">
          <div>
            <label>includeRagContext</label>
            <select id="includeRagContext">
              <option value="" selected>请选择</option>
              <option value="false">false</option>
              <option value="true">true</option>
            </select>
          </div>
          <div>
            <label>includeKnowledgeGraphContext</label>
            <select id="includeKnowledgeGraphContext">
              <option value="" selected>请选择</option>
              <option value="false">false</option>
              <option value="true">true</option>
            </select>
          </div>
        </div>
        <div class="btns">
          <button id="connectBtn" type="button">Connect</button>
          <button id="sendBtn" type="button">Send Command</button>
          <button class="warn" id="stopBtn" type="button">Interrupt</button>
          <button class="alt" id="disconnectBtn" type="button">Disconnect</button>
          <button class="alt" id="newSessionBtn" type="button">New Session</button>
          <button class="alt" id="clearBtn" type="button">Clear</button>
        </div>
        <div class="status" id="status">idle</div>
      </section>
      <section class="card">
        <h2>Session Stream</h2>
        <p class="panel-title">当前会话事件日志</p>
        <div class="stream" id="sessionStream"></div>
        <p class="panel-title" style="margin-top: 10px;">当前最终输出</p>
        <div class="final" id="sessionFinal"></div>
        <p class="panel-title" style="margin-top: 10px;">命令记录</p>
        <div class="runs" id="runs"></div>
      </section>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const runsBox = $("runs");
    const statusBox = $("status");
    const sessionStreamBox = $("sessionStream");
    const sessionFinalBox = $("sessionFinal");
    const SESSION_KEY = "lumisight.agent.sessionId";
    const USER_KEY = "lumisight.agent.userId";
    const EVENT_TYPES = [
      "PLAN", "SKILL_SELECTED", "SKILL_ROUTE", "DIALOGUE_MODE", "LOOP_STATE",
      "TOOL_CALL", "TOOL_RESULT", "ASK_USER", "HUMAN_GATE", "VERIFY_RESULT",
      "TOKEN", "FINAL", "ERROR", "INTERRUPTED", "RESUMED"
    ];
    let eventSource = null;

    function randomId(prefix) {
      return `${prefix}-${Math.random().toString(36).slice(2, 10)}`;
    }

    function ensureIdentity() {
      const savedUserId = localStorage.getItem(USER_KEY);
      const savedSessionId = localStorage.getItem(SESSION_KEY);
      $("userId").value = savedUserId || randomId("debug-user");
      $("sessionId").value = savedSessionId || randomId("session");
      localStorage.setItem(USER_KEY, $("userId").value);
      localStorage.setItem(SESSION_KEY, $("sessionId").value);
    }

    function resetSession() {
      disconnect();
      $("sessionId").value = randomId("session");
      localStorage.setItem(SESSION_KEY, $("sessionId").value);
      statusBox.textContent = "new session ready";
    }

    function createRunView(requestBody) {
      const card = document.createElement("div");
      card.className = "run-card";

      const head = document.createElement("div");
      head.className = "run-head";

      const title = document.createElement("div");
      title.className = "run-title";
      title.textContent = `${requestBody.dialogueMode || "FOLLOW"} | ${requestBody.question || "(empty question)"}`;

      const meta = document.createElement("div");
      meta.className = "run-meta";
      meta.textContent = `${requestBody.sessionId || "-"} @ ${new Date().toLocaleTimeString()}`;

      head.appendChild(title);
      head.appendChild(meta);

      const stream = document.createElement("div");
      stream.className = "stream";

      const final = document.createElement("div");
      final.className = "final";

      card.appendChild(head);
      card.appendChild(stream);
      card.appendChild(final);
      runsBox.prepend(card);

      return {
        appendStream(line) {
          stream.textContent += line + "\n";
          stream.scrollTop = stream.scrollHeight;
        },
        appendFinal(text) {
          final.textContent += text;
          final.scrollTop = final.scrollHeight;
        },
        appendFinalLine(text) {
          if (final.textContent.length > 0 && !final.textContent.endsWith("\n")) {
            final.textContent += "\n";
          }
          final.textContent += text + "\n";
          final.scrollTop = final.scrollHeight;
        }
      };
    }

    function asBool(value) {
      return String(value) === "true";
    }

    function payload() {
      const maybe = (v) => v && v.trim().length > 0 ? v.trim() : null;
      const maybeNumber = (v) => {
        const text = maybe(v);
        return text ? Number(text) : null;
      };
      return {
          taskType: maybe($("taskType").value),
          repoRoot: maybe($("repoRoot").value),
          question: maybe($("question").value),
          skillPath: maybe($("skillPath").value),
          userId: maybe($("userId").value),
          sessionId: maybe($("sessionId").value),
        approveRiskyToolCall: false,
        interrupt: false,
        resume: false,
        includeRagContext: maybe($("includeRagContext").value) == null ? null : asBool($("includeRagContext").value),
        includeKnowledgeGraphContext: maybe($("includeKnowledgeGraphContext").value) == null ? null : asBool($("includeKnowledgeGraphContext").value),
        contextLimit: maybeNumber($("contextLimit").value),
        runMode: maybe($("runMode").value),
        dialogueMode: maybe($("dialogueMode").value)
      };
    }

    function appendSessionStream(line) {
      sessionStreamBox.textContent += line + "\n";
      sessionStreamBox.scrollTop = sessionStreamBox.scrollHeight;
    }

    function appendSessionFinal(text) {
      sessionFinalBox.textContent += text;
      sessionFinalBox.scrollTop = sessionFinalBox.scrollHeight;
    }

    function appendSessionFinalLine(text) {
      if (sessionFinalBox.textContent.length > 0 && !sessionFinalBox.textContent.endsWith("\n")) {
        sessionFinalBox.textContent += "\n";
      }
      sessionFinalBox.textContent += text + "\n";
      sessionFinalBox.scrollTop = sessionFinalBox.scrollHeight;
    }

    function handleEventMessage(eventName, rawData) {
      if (!rawData) return;
      appendSessionStream(`[${eventName}] ${rawData}`);
      try {
        const obj = JSON.parse(rawData);
        if (obj.type === "TOKEN") {
          appendSessionFinal(obj.message || "");
        } else if (obj.type === "FINAL" || obj.type === "ASK_USER" || obj.type === "ERROR") {
          appendSessionFinalLine(obj.message || "");
        } else if (obj.type === "INTERRUPTED") {
          appendSessionFinalLine("[INTERRUPTED] " + (obj.message || ""));
        }
      } catch (_) {}
    }

    function currentSessionId() {
      return ($("sessionId").value || "").trim();
    }

    function isConnectedToCurrentSession() {
      return eventSource && eventSource.readyState !== EventSource.CLOSED && eventSource.sessionId === currentSessionId();
    }

    function disconnect() {
      if (!eventSource) return;
      eventSource.close();
      eventSource = null;
      statusBox.textContent = "disconnected";
    }

    function connect() {
      const sessionId = currentSessionId();
      if (!sessionId) {
        statusBox.textContent = "sessionId required";
        return;
      }
      if (isConnectedToCurrentSession()) {
        statusBox.textContent = "connected";
        return;
      }
      disconnect();
      const source = new EventSource(`/api/lumisight/agent/stream?sessionId=${encodeURIComponent(sessionId)}`);
      source.sessionId = sessionId;
      EVENT_TYPES.forEach((type) => {
        source.addEventListener(type, (event) => handleEventMessage(type, event.data));
      });
      source.onopen = () => {
        statusBox.textContent = `connected: ${sessionId}`;
      };
      source.onerror = () => {
        if (source !== eventSource) {
          return;
        }
        statusBox.textContent = "stream disconnected";
      };
      eventSource = source;
    }

    async function sendCommand(commandPayload) {
      const response = await fetch("/api/lumisight/agent/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(commandPayload)
      });
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }
    }

    async function start() {
      const requestBody = payload();
      if (!isConnectedToCurrentSession()) {
        connect();
      }
      createRunView(requestBody).appendStream("[submitted] command accepted locally, waiting for session events...");
      statusBox.textContent = "submitting...";
      await sendCommand(requestBody);
      statusBox.textContent = `connected: ${requestBody.sessionId}`;
    }

    function interruptPayload(sessionId, taskType) {
      return {
        taskType: taskType || "CHAT",
        repoRoot: null,
        question: null,
        skillPath: null,
        userId: null,
        sessionId: sessionId,
        approveRiskyToolCall: false,
        interrupt: true,
        resume: false,
        includeRagContext: null,
        includeKnowledgeGraphContext: null,
        contextLimit: null,
        runMode: $("runMode").value || "NORMAL",
        dialogueMode: $("dialogueMode").value || "FOLLOW"
      };
    }

    async function interrupt() {
      const requestBody = interruptPayload(currentSessionId(), $("taskType").value || "CHAT");
      await sendCommand(requestBody);
      statusBox.textContent = "interrupt sent";
    }

    $("connectBtn").addEventListener("click", () => {
      localStorage.setItem(USER_KEY, $("userId").value);
      localStorage.setItem(SESSION_KEY, $("sessionId").value);
      connect();
    });
    $("sendBtn").addEventListener("click", () => {
      localStorage.setItem(USER_KEY, $("userId").value);
      localStorage.setItem(SESSION_KEY, $("sessionId").value);
      start().catch((e) => {
        statusBox.textContent = "failed: " + e.message;
      });
    });
    $("disconnectBtn").addEventListener("click", () => {
      disconnect();
    });
    $("newSessionBtn").addEventListener("click", () => {
      resetSession();
    });
    $("clearBtn").addEventListener("click", () => {
      runsBox.textContent = "";
      sessionStreamBox.textContent = "";
      sessionFinalBox.textContent = "";
      statusBox.textContent = "idle";
    });
    $("stopBtn").addEventListener("click", () => {
      interrupt().catch((e) => {
        statusBox.textContent = "interrupt failed: " + e.message;
      });
    });
    ensureIdentity();
  </script>
</body>
</html>
